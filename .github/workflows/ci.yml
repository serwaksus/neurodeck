name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check:js
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:e2e:visual
        id: visual
        # Baselines were captured off-CI; ubuntu-latest rendering differs.
        # Non-blocking until CI-native baselines prove stable.
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        # failure() misses the visual step (continue-on-error keeps the job
        # green), so also fire on its raw outcome.
        if: failure() || steps.visual.outcome == 'failure'
        with:
          name: test-failure-artifacts
          path: |
            test-results/
            tests/e2e/snapshots/*-diff.png
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -f index_backup.html index768_backup.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
