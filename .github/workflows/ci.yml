name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.node }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check:js
      - run: npm test
      # retries=1 только в CI (флаг поверх конфига; локально поведение не меняется)
      - run: npm run test:e2e -- --retries=1
      - run: npm run test:e2e:visual
        id: visual
        # Baselines were captured off-CI; ubuntu-latest rendering differs.
        # Non-blocking until CI-native baselines prove stable.
        continue-on-error: true
      - run: npm run test:playtest:strongholds
      - run: npm run test:playtest:acceptance
      - run: npm run test:qa:data
      - run: npm run test:qa:chaos
      - run: npm run test:qa:parity
      - uses: actions/upload-artifact@v7
        # failure() misses the visual step (continue-on-error keeps the job
        # green), so also fire on its raw outcome.
        if: failure() || steps.visual.outcome == 'failure'
        with:
          name: test-failure-artifacts-node${{ matrix.node }}
          path: |
            test-results/
            tests/e2e/snapshots/*-diff.png
          retention-days: 7

  release-gate:
    # R3 (queue 4): блокирующий гейт перед деплоем. В отличие от матричного job
    # `test`: visual БЛОКИРУЕТ (там continue-on-error — базлайны сняты вне CI),
    # economy sim включён (в матрице его нет), ретраи только у браузерных шагов
    # с фиксацией флаков, полный артефакт (SHA/env/commands/exits) пишется в
    # docs/release/verify/artifact.json. Только push в main: PR-фидбэк даёт
    # матрица, гейт нужен ровно там, где решается деплой.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-release-gate-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npx playwright install chromium
      - name: Release gate (visual blocking, economy sim included)
        run: npm run release:verify
      - name: Upload release gate artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate-artifact
          path: docs/release/verify/
          retention-days: 30

  deploy:
    # R3: деплой только после блокирующего release-гейта (и матрицы test).
    needs: [test, release-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: rm -f index_backup.html index768_backup.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
